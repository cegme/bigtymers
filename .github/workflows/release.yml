name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rpm tooling
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build packages
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sh packaging/build-deb.sh "$VERSION"
          sh packaging/build-rpm.sh "$VERSION"
          mv dist/btyme_*_all.deb dist/btyme_all.deb
          mv dist/btyme-*.noarch.rpm dist/btyme.noarch.rpm
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/btyme_all.deb dist/btyme.noarch.rpm --title "$GITHUB_REF_NAME" --generate-notes
